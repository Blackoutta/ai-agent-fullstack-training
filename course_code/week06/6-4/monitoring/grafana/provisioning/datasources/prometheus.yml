apiVersion: 1

datasources:
  - name: Prometheus
    # 显式声明 uid：看板 JSON 里的面板会以 uid="prometheus" 引用数据源。
    # 不写这一行 Grafana 会自动生成随机 uid（如 PBFA97CFB590B2093），
    # 面板引用不到数据源，看板就会整片显示 No data。
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 5s
