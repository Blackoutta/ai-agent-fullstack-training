# Prometheus + Grafana 本地监控栈
#
# 启动：npm run prom:up   （等价于 docker compose -f monitoring/docker-compose.yml up -d）
# Grafana：    http://127.0.0.1:3000   （匿名访问，无需登录）
# Prometheus： http://127.0.0.1:9092
#
# 端口说明：9090 常被其他本地服务（例如自托管的 minio）占用，
# 因此 Prometheus 对外映射到 9092，容器内部仍是标准 9090。
# 如果本机 9090 空闲，把下面的 9092 改成 9090 即可。
services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: pi-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9092:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # pi-prometheus 扩展写出的会话采集地址，只读挂载给 file_sd_configs
      - ${HOME}/.pi/metrics/targets:/etc/prometheus/targets:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    extra_hosts:
      # 让容器能访问宿主机上的业务后端端点
      - "host.docker.internal:host-gateway"

  # 宿主机系统指标（可选）：提供 node_load1、node_memory_*、node_filesystem_* 等
  # 采集结果由 prometheus.yml 的 node-exporter 任务抓取
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: pi-node-exporter
    restart: unless-stopped
    ports:
      - "127.0.0.1:9100:9100"
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave

  # Grafana：看板与数据源均通过 provisioning 自动配置，无需手工添加
  grafana:
    image: grafana/grafana:11.4.0
    container_name: pi-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # 演示环境：免登录、默认落到 Pi 看板，不用记账号密码
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_DEFAULT_THEME=dark
      # 不向 Grafana 官方上报使用数据
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
